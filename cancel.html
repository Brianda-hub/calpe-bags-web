<style>
  :root{
    --azul-oscuro:#0b3d5c; --azul:#0f6ba8; --arena:#f6efe3;
    --coral:#ff7a59; --texto:#1c2b33; --gris:#5b6b73; --blanco:#ffffff;
    --radio:14px; --sombra:0 8px 24px rgba(11,61,92,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--arena); color:var(--texto); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--blanco); border-radius:var(--radio); box-shadow:var(--sombra);
    max-width:480px; width:100%; padding:40px 32px; text-align:center;
  }
  .icon{
    width:64px; height:64px; border-radius:50%; background:#fdeceb; color:var(--coral);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
    font-size:1.8rem; font-weight:800;
  }
  h1{color:var(--azul-oscuro); font-size:1.5rem; margin-bottom:12px;}
  p{color:var(--gris); font-size:0.95rem; margin-bottom:8px; line-height:1.5;}
  a.btn{
    display:inline-block; margin-top:14px; background:var(--azul); color:var(--blanco);
    padding:12px 26px; border-radius:30px; text-decoration:none; font-weight:700; font-size:0.92rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✕</div>
    <h1>Pago cancelado</h1>
    <p>No se ha completado ningún cargo. Puedes volver a intentarlo cuando quieras.</p>
    <a class="btn" href="/#reservar">Volver a la reserva</a>
  </div>
</body>
</html>
