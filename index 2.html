<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cerrado temporalmente / Temporarily closed</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: Arial, Helvetica, sans-serif; background:#f5f1e8; color:#222; text-align:center; }
  main { padding:2rem; max-width:480px; }
  h1 { font-size:1.8rem; margin-bottom:.3rem; }
  p { font-size:1.1rem; margin:.3rem 0 1.5rem; color:#555; }
  hr { border:none; border-top:1px solid #ccc; margin:1.5rem 0; }
</style>
</head>
<body>
<main>
  <h1>Cerrado temporalmente</h1>
  <p>Volvemos pronto. Gracias por tu paciencia.</p>
  <hr>
  <h1>Temporarily closed</h1>
  <p>We'll be back soon. Thank you for your patience.</p>
</main>
</body>
</html>
